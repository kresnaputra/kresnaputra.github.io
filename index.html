<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agara Games</title>
<meta name="description" content="Small, calm mobile games by Agara.">
<style>
 :root{--paper:#f7f4eb;--ink:#263c43;--muted:#5f6b63;--line:#e2decf;--accent:#4f7a5f;}
 *{box-sizing:border-box}
 body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
 main{max-width:640px;margin:0 auto;padding:56px 20px 72px}
 h1{font-size:34px;margin:0 0 6px}
 .muted{color:var(--muted)}
 ul{list-style:none;padding:0;margin:28px 0 0}
 li{border-top:1px solid var(--line);padding:16px 0;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
 li:last-child{border-bottom:1px solid var(--line)}
 strong{font-size:18px}
 a{color:var(--accent)}
</style>
</head>
<body>
<main>
 <h1>Agara Games</h1>
 <p class="muted">Small, calm mobile games. Contact: <a href="mailto:agaratechid@gmail.com">agaratechid@gmail.com</a></p>
 <ul>
  <li><strong>Cut &amp; Fit</strong><a href="./cut-and-fit-privacy/">Privacy Policy</a></li>
  <li><strong>Dino Matching</strong><a href="./dino-matching-privacy/">Privacy Policy</a></li>
 </ul>
</main>
</body>
</html>
